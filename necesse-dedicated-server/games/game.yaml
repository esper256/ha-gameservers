name: Necesse
steam_app_id: 1169370
steam_login: anonymous
steam_branch: public
# Pin SteamCMD to Linux depots (this add-on is amd64 Linux / HAOS only).
steam_platform: linux
validate_on_update: true
working_dir: /data/game
data_dir: /data/world
logs_dir: /data/logs
install_marker: Server.jar
min_backup_bytes: 1024
stop_timeout_seconds: 240
stop_stdin_commands:
  - save
  - exit
pre_backup_stdin_commands:
  - save
# Fallback roots when no named world exists yet; also used to restore legacy
# *.tar.gz snapshots. New backups follow world_save kind (copy the .zip as-is).
backup_paths:
  - /data/world
# Active world artifact for status UI, upload restore, and by-kind backups.
world_save:
  strategy: named_path
  paths:
    - "{data_dir}/saves/worlds/{world_name}.zip"
    - "{data_dir}/saves/worlds/{world_name}"
world_catalog:
  glob: "{data_dir}/saves/worlds/*"
  name_from: stem
executable:
  - java
  - -jar
  - Server.jar
  - -nogui
bool_style: one_zero
ready_timeout_seconds: 180
# server_port is forced to 14159 by run.sh (HA container-side Network mapping).
arg_map:
  world_name: -world
  server_port: -port
  server_slots: -slots
  server_owner: -owner
  server_motd: -motd
  server_password: -password
  pause_when_empty: -pausewhenempty
  give_clients_power: -giveclientspower
  enable_logging: -logging
  zip_saves: -zipsaves
  server_language: -language
  settings_file: -settings
  bind_ip: -ip
  max_client_latency: -maxlatency
  data_dir: -datadir
  logs_dir: -logs
# Ingress status page colors (green / amber). Other games set their own ui_theme.
ui_theme:
  bg: "#12201a"
  panel: "#1c3027"
  ink: "#e7f0ea"
  muted: "#9bb5a6"
  accent: "#d4a25a"
  good: "#6fbf8a"
  bad: "#d9786a"
  glow: "#243f33"
  wash: "#0e1814"
  depth: "#1a1710"
# Idle vs occupied only — Necesse join/leave identity is unreliable enough that a
# numeric headcount can stick (join SteamID vs leave display-name mismatch).
# Presence (generic): join → occupied; matching leave may keep others; unknown
# leave identity → idle so occupancy cannot stick and block updates.
# Do NOT activate “Found N saved players” or “empty server” GC lines as player_count.
# version_mismatch: active — rejected clients queue a Steam update *check* first;
# the server is only stopped when Steam reports a newer build (then bypass quiet
# hours, wait for empty, orderly save/exit + stop_timeout, SteamCMD app_update).
# Note: Necesse often writes logs under data_dir (latest-server-log.txt /
# data/logs/*.txt) even when -logs points at /data/logs; the supervisor searches both.
player_tracking_mode: presence
log_patterns:
  ready:
    - '\bStarted server using port\s+(?P<port>\d+)\b'
  game_version:
    - '\bgame version\s+(?P<version>\d+(?:\.\d+)+)\b'
    - '\bLoading dedicated server on version\s+(?P<version>\d+(?:\.\d+)+)\b'
  player_join:
    - 'Client "(?P<player>[^"]+)" connected on slot\s+\d+/\d+'
  player_leave:
    # SteamID first: Player 7656… ("Name") disconnected…
    - 'Player (?P<player>\S+)\s+\([^)]*\)\s+disconnected\b'
    # Display name first with SteamID in parens.
    - 'Player "[^"]+"\s+\((?P<player>\d+)\)\s+disconnected\b'
    - 'Player (?P<player>[^\s(]+)\s+\((?P<steam_id>\d+)\)\s+disconnected\b'
  version_mismatch:
    - 'Client\s+"(?P<steam_id>\d+)"\s+had wrong version\s+\((?P<client_version>[^)]+)\)'
