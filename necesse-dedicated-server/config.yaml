name: "Necesse Dedicated Server"
description: "Necesse dedicated multiplayer server with SteamCMD auto-updates, player-aware restarts, generational world backups, and an Ingress status/log toolkit."
version: "3.14.0"
slug: "necesse_dedicated_server"
url: "https://github.com/esper256/ha-gameservers/tree/main/necesse-dedicated-server"
# SteamCMD / Necesse dedicated server binaries are x86_64. HAOS on aarch64 will not offer this app.
arch:
  - amd64
startup: application
boot: auto
init: false
host_network: false
hassio_api: true
homeassistant_api: true
# Ingress = OPEN WEB UI (appears after the app is started). Uses HA auth; no host port.
ingress: true
ingress_port: 8099
ingress_entry: /
ingress_stream: true
panel_icon: mdi:sword
panel_title: Necesse
# HA format is "container-port/udp: host-port". The container port is fixed at
# 14159 (Necesse listens there). The Network UI only changes the host port.
ports:
  14159/udp: 14159
ports_description:
  14159/udp: Port players use on this Home Assistant machine (UDP). Leave at 14159 unless that port is already taken.
options:
  world_name: "World"
  server_password: ""
  server_slots: 10
  server_owner: ""
  server_motd: "Welcome to the server!"
  pause_when_empty: true
  give_clients_power: false
  enable_logging: true
  zip_saves: true
  server_language: "en"
  java_opts: "-Xms512M -Xmx2G"
  steam_branch: public
  update_on_start: true
  auto_update_interval_minutes: 1440
  auto_update_check_hour: 5
  update_when_empty_only: true
  update_on_version_mismatch: true
  debug_mode: false
  restart_on_crash: true
  status_http_enabled: true
  ha_notifications: true
  backup_enabled: true
  backup_on_update: true
  backup_retention: standard
  min_free_disk_mb: 512
schema:
  world_name: str
  server_password: password
  server_slots: int(1,250)
  server_owner: str?
  server_motd: str
  pause_when_empty: bool
  give_clients_power: bool
  enable_logging: bool
  zip_saves: bool
  server_language: str
  java_opts: str?
  steam_branch: list(public|experimental)
  update_on_start: bool
  auto_update_interval_minutes: int(0,)
  auto_update_check_hour: int(0,23)?
  update_when_empty_only: bool
  update_on_version_mismatch: bool
  debug_mode: bool
  update_window_start_hour: int(0,23)?
  update_window_end_hour: int(0,23)?
  restart_on_crash: bool
  status_http_enabled: bool
  ha_notifications: bool
  backup_enabled: bool
  backup_on_update: bool
  backup_retention: list(minimal|standard|extended)
  min_free_disk_mb: int(0,)
backup_exclude:
  - "**/steamapps/**"
  - "**/steamcmd/**"
  - "game/**"
watchdog: http://[HOST]:[PORT:8099]/healthz
# Supervisor hard-caps timeout at 300. Values above that make the app vanish from the store.
# Used for Docker start *and* stop grace (SIGTERM → wait → SIGKILL). Keep game
# stop_timeout_seconds below this so post-quit supervisor cleanup can finish.
timeout: 300
