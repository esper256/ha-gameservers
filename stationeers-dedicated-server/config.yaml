name: "Stationeers Dedicated Server"
description: "Stationeers dedicated multiplayer server with SteamCMD auto-updates, player-aware restarts, generational world backups, and an Ingress status/log toolkit."
version: "3.11.0"
slug: "stationeers_dedicated_server"
url: "https://github.com/esper256/ha-gameservers/tree/main/stationeers-dedicated-server"
# SteamCMD / Stationeers dedicated server binaries are x86_64. HAOS on aarch64 will not offer this app.
arch:
  - amd64
startup: application
boot: auto
init: false
host_network: false
hassio_api: true
homeassistant_api: true
# Ingress = OPEN WEB UI (appears after the app is started). Uses HA auth; no host port.
ingress: true
ingress_port: 8099
ingress_entry: /
ingress_stream: true
panel_icon: mdi:rocket-launch
panel_title: Stationeers
# HA format is "container-port/protocol: host-port". Container ports are fixed
# (GamePort 27016, UpdatePort 27015). The Network UI only changes host ports.
ports:
  27016/udp: 27016
  27015/udp: 27015
ports_description:
  27016/udp: Game port players use on this Home Assistant machine (UDP). Leave at 27016 unless that port is already taken.
  27015/udp: Steam query / update port (UDP). Leave at 27015 unless that port is already taken.
options:
  world_name: "World"
  world_type: "Mars2"
  server_name: ""
  server_password: ""
  server_slots: 10
  server_visible: false
  auto_save: true
  save_interval: 300
  auto_pause: true
  upnp_enabled: false
  use_steam_p2p: false
  server_auth_secret: ""
  difficulty: ""
  start_condition: ""
  start_location: ""
  steam_branch: public
  update_on_start: true
  auto_update_interval_minutes: 1440
  auto_update_check_hour: 5
  update_when_empty_only: true
  update_on_version_mismatch: true
  debug_mode: false
  restart_on_crash: true
  status_http_enabled: true
  ha_notifications: true
  backup_enabled: true
  backup_on_update: true
  backup_retention: standard
  min_free_disk_mb: 1024
schema:
  world_name: str
  world_type: str
  server_name: str?
  server_password: password
  server_slots: int(1,30)
  server_visible: bool
  auto_save: bool
  save_interval: int(30,3600)
  auto_pause: bool
  upnp_enabled: bool
  use_steam_p2p: bool
  server_auth_secret: password
  difficulty: str?
  start_condition: str?
  start_location: str?
  steam_branch: list(public|beta)
  update_on_start: bool
  auto_update_interval_minutes: int(0,)
  auto_update_check_hour: int(0,23)?
  update_when_empty_only: bool
  update_on_version_mismatch: bool
  debug_mode: bool
  update_window_start_hour: int(0,23)?
  update_window_end_hour: int(0,23)?
  restart_on_crash: bool
  status_http_enabled: bool
  ha_notifications: bool
  backup_enabled: bool
  backup_on_update: bool
  backup_retention: list(minimal|standard|extended)
  min_free_disk_mb: int(0,)
backup_exclude:
  - "**/steamapps/**"
  - "**/steamcmd/**"
  - "game/**"
watchdog: http://[HOST]:[PORT:8099]/healthz
# Supervisor hard-caps timeout at 300. Values above that make the app vanish from the store.
# Used for Docker start *and* stop grace (SIGTERM → wait → SIGKILL). Keep game
# stop_timeout_seconds below this so post-quit supervisor cleanup can finish.
timeout: 300
