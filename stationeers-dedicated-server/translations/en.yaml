configuration:
  world_name:
    name: Save name
    description: Stationeers save folder name (no spaces; e.g. World). Created under /data/world/saves/ on first start.
  world_type:
    name: World / map
    description: "Map used when the save does not exist yet. Default Mars2 (Mars). Common values: Mars2, Lunar, Europa3, MimasHerschel, Vulcan, Venus. Legacy maps (moon, mars, …) also work on older branches."
  server_name:
    name: Server name
    description: "Optional name shown to players / in the server browser. Leave blank to use a stable generated name like HAOS Stationeers 4821 (same digits for this install; different across installs)."
  server_password:
    name: Server password
    description: Password required to join. Leave empty for an open server.
  server_slots:
    name: Max players
    description: Maximum concurrent players (1–30).
  server_visible:
    name: List on server browser
    description: "When on, ping the Stationeers master server so this host appears in the public in-game list. Default off (LAN / direct connect only)."
  auto_save:
    name: Autosave
    description: Periodically save the world while the server runs.
  save_interval:
    name: Autosave interval (seconds)
    description: Seconds between autosaves when Autosave is on (default 300).
  auto_pause:
    name: Pause when empty
    description: Pause the simulation when no players are connected.
  upnp_enabled:
    name: UPnP
    description: Ask a compatible router to forward ports automatically. Prefer manual port-forwarding on Home Assistant.
  use_steam_p2p:
    name: Steam P2P
    description: Allow Steam P2P connections. Usually leave off for a dedicated host.
  server_auth_secret:
    name: Server auth secret
    description: Shared secret so trusted clients can run server commands (must match the client setting). Leave empty to disable.
  difficulty:
    name: Difficulty (new worlds)
    description: "Optional. Common values: Creative, Easy, Normal, Stationeer. Leave empty for the map default. If you set start condition or location, set difficulty too."
  start_condition:
    name: Start condition (new worlds)
    description: "Optional starting kit / scenario for a new world. Common values: DefaultStart, DefaultStartCommunity, Brutal, BrutalCommunity (Europa maps use EuropaDefault / EuropaDefaultCommunity / EuropaBrutal / EuropaBrutalCommunity). Leave empty for the map default. Requires difficulty when set."
  start_location:
    name: Start location (new worlds)
    description: "Optional spawn-location id for a new world (map-specific, e.g. MarsSpawnCanyonOverlook). Leave empty for the map default. Requires difficulty and start condition when set."
  steam_branch:
    name: Steam branch
    description: "SteamCMD branch to install. Public is the normal release; Beta is Stationeers’ Steam beta branch when available. Clients must match. Changing branch redownloads on the next update."
  update_on_start:
    name: Update on start
    description: Run SteamCMD before launching the server.
  auto_update_interval_minutes:
    name: Auto-update interval (minutes)
    description: Used only when “Daily Steam check hour” is empty. How often to ask Steam whether a newer dedicated-server build exists. 0 turns periodic Steam checks off. Values below 15 are raised to 15.
  auto_update_check_hour:
    name: Daily Steam check hour
    description: Local hour (0–23) to ask Steam once per day for a newer dedicated-server build. Default is 5 (5:00am). Leave empty to use the interval setting instead.
  update_when_empty_only:
    name: Update only when empty
    description: When a newer build is ready, wait until nobody is online before restarting so players are not interrupted. Requires working player join/leave detection (configured log patterns) — without that, emptiness cannot be determined and updates will not proceed while this is on.
  update_on_version_mismatch:
    name: Update on version mismatch
    description: If clients are rejected for a wrong/outdated version, check Steam for a newer build and only then restart to update.
  debug_mode:
    name: Debug mode
    description: Show Ingress log-watch pattern tooling (dry-run regex hits) and keep the Number of players card visible even when player-count patterns are still dry-run. Leave off for normal operation.
  update_window_start_hour:
    name: Update window start hour
    description: Optional local hour (0-23) when routine Steam updates may begin. Leave empty for any time.
  update_window_end_hour:
    name: Update window end hour
    description: Optional local hour (0-23) when routine Steam updates must stop. Leave empty for any time.
  restart_on_crash:
    name: Restart on crash
    description: Automatically relaunch the server process after an unexpected exit.
  status_http_enabled:
    name: Status page
    description: Serve the supervisor status/log HTTP UI used by Home Assistant OPEN WEB UI (Ingress on port 8099).
  ha_notifications:
    name: Home Assistant notifications
    description: Create persistent notifications on crash, update failure, and version mismatch (uses HA Core API, not MQTT).
  backup_enabled:
    name: Enable backups
    description: Daily backup of the active world save folder into /data/backups (zipped). History is thinned by the retention profile below.
  backup_on_update:
    name: Backup before update
    description: Back up the world save immediately before a Steam update. Only the newest pre-update backup is kept.
  backup_retention:
    name: Backup retention
    description: "Scheduled history uses daily→weekly→monthly thinning; pre-restore safety copies use the same profile (minimal=1 day, standard=7 days, extended=30 days). Only one pre-update backup is kept."
  min_free_disk_mb:
    name: Minimum free disk (MiB)
    description: Skip backups/updates when free space under /data falls below this threshold.
network:
  27016/udp: Game port players use in Stationeers to reach this server on your Home Assistant machine (UDP). Leave at 27016 unless that port is already taken.
  27015/udp: Steam query / update port (UDP). Leave at 27015 unless that port is already taken.
