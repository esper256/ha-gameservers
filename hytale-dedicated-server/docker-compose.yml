# Portainer / plain Docker example for Hytale.
# Builds the thin Hytale add-on image (generic supervisor + Java 25 + game.yaml).
#
# Security note: the status UI on :8099 is passwordless. Outside Home Assistant
# there is no Ingress auth and no peer allowlist. Bind it to localhost only
# (below), or put it behind your own reverse-proxy auth. Do not publish 8099 on
# a public interface.
services:
  hytale:
    build:
      context: .
      dockerfile: Dockerfile
    image: hytale-dedicated-server:local
    container_name: hytale
    restart: unless-stopped
    ports:
      - "5520:5520/udp"
      - "127.0.0.1:8099:8099"
    environment:
      GAME_PLUGIN: /opt/games/game.yaml
      INSTALL_DIR: /data/game
      DATA_DIR: /data/world
      STATE_DIR: /data/supervisor
      WORLD_NAME: default
      SERVER_MOTD: Welcome to the server!
      SERVER_PASSWORD: changeme
      SERVER_SLOTS: "20"
      JAVA_OPTS: "-Xms2G -Xmx4G"
      RELEASE_CHANNEL: release
      UPDATE_ON_START: "true"
      AUTO_UPDATE_CHECK_HOUR: "5"
      AUTO_UPDATE_INTERVAL_MINUTES: "1440"
      UPDATE_WHEN_EMPTY_ONLY: "true"
      UPDATE_ON_VERSION_MISMATCH: "false"
      STATUS_HTTP_ENABLED: "true"
      STATUS_HTTP_PORT: "8099"
      HA_NOTIFICATIONS: "false"
      SERVER_PORT: "5520"
      BACKUP_ENABLED: "true"
      BACKUP_INTERVAL_MINUTES: "1440"
      BACKUP_ON_UPDATE: "true"
      BACKUP_RETENTION: standard
      MIN_FREE_DISK_MB: "4096"
      TZ: America/Los_Angeles
    volumes:
      - ./data:/data
    stop_grace_period: 300s
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8099/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 180s
