name: "Minecraft Dedicated Server"
description: "Family Minecraft Java server with Fabric or NeoForge per world, kid JAR uploads, AutoModpack client sync, and world backups."
version: "3.8.1"
slug: "minecraft_dedicated_server"
url: "https://github.com/esper256/ha-gameservers/tree/main/minecraft-dedicated-server"
arch:
  - amd64
startup: application
boot: auto
init: false
host_network: false
hassio_api: true
homeassistant_api: true
ingress: true
ingress_port: 8099
ingress_entry: /
ingress_stream: true
panel_icon: mdi:cube-outline
panel_title: Minecraft
ports:
  25565/tcp: 25565
  8765/tcp: 8765
ports_description:
  25565/tcp: Minecraft Java game port
  8765/tcp: Kid mod-upload page (Copyparty), LAN only
options:
  world_name: "FamilyWorld"
  minecraft_version: "1.21.1"
  server_motd: "Family Minecraft"
  server_slots: 8
  online_mode: true
  white_list: true
  eula: true
  publisher_password: "family"
  java_opts: "-Xms2G -Xmx4G"
  update_on_start: true
  auto_update_interval_minutes: 0
  auto_update_check_hour: 5
  update_when_empty_only: true
  update_on_version_mismatch: false
  debug_mode: false
  restart_on_crash: true
  status_http_enabled: true
  ha_notifications: true
  backup_enabled: true
  backup_on_update: true
  backup_retention: standard
  min_free_disk_mb: 2048
schema:
  world_name: str
  minecraft_version: str
  server_motd: str
  server_slots: int(1,100)
  online_mode: bool
  white_list: bool
  eula: bool
  publisher_password: password
  java_opts: str?
  update_on_start: bool
  auto_update_interval_minutes: int(0,)
  auto_update_check_hour: int(0,23)?
  update_when_empty_only: bool
  update_on_version_mismatch: bool
  debug_mode: bool
  update_window_start_hour: int(0,23)?
  update_window_end_hour: int(0,23)?
  restart_on_crash: bool
  status_http_enabled: bool
  ha_notifications: bool
  backup_enabled: bool
  backup_on_update: bool
  backup_retention: list(minimal|standard|extended)
  min_free_disk_mb: int(0,)
backup_exclude:
  - "installs/**"
  - "**/libraries/**"
watchdog: http://[HOST]:[PORT:8099]/healthz
timeout: 300
