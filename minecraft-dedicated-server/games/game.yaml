name: Minecraft
package_install:
  kind: command
  version_argv:
    - python3
    - /opt/haos_defaults.py
    - print-version
  install_argv:
    - python3
    - /opt/haos_defaults.py
    - install
working_dir: /data/worlds
data_dir: /data/worlds
logs_dir: /data/logs
install_marker: .loaders_ready
min_backup_bytes: 1024
stop_timeout_seconds: 120
stop_stdin_commands:
  - stop
pre_backup_stdin_commands:
  - save-all flush
backup_paths:
  - /data/worlds
world_save:
  strategy: named_path
  paths:
    - "{data_dir}/{world_name}"
world_catalog:
  glob: "{data_dir}/*"
  name_from: directory
  caption_file: profile.json
  caption_json_path: caption
# Static on purpose: the supervisor already renders select options from this
# file, so a new Minecraft release is an add-on release rather than a
# supervisor feature. Every entry has a stable Fabric build and a stable
# NeoForge build (checked October 2026). Default matches the old
# Configuration pin so a brand-new "World" profile stays on 1.21.1.
world_create:
  fields:
    - id: minecraft_version
      kind: select
      label: Minecraft version
      default: "1.21.1"
      options:
        - value: "26.2"
          label: "26.2"
        - value: "26.1.2"
          label: "26.1.2"
        - value: "1.21.11"
          label: "1.21.11"
        - value: "1.21.10"
          label: "1.21.10"
        - value: "1.21.8"
          label: "1.21.8"
        - value: "1.21.5"
          label: "1.21.5"
        - value: "1.21.4"
          label: "1.21.4"
        - value: "1.21.3"
          label: "1.21.3"
        - value: "1.21.1"
          label: "1.21.1"
        - value: "1.21"
          label: "1.21"
        - value: "1.20.6"
          label: "1.20.6"
        - value: "1.20.4"
          label: "1.20.4"
        - value: "1.20.2"
          label: "1.20.2"
        - value: "1.20.1"
          label: "1.20.1"
world_prepare:
  when: missing
  timeout_seconds: 180
  argv:
    - prepare
executable:
  - /opt/launch_wrapper.sh
bool_style: true_false
ready_timeout_seconds: 300
env_options:
  - JAVA_OPTS
  - MINECRAFT_VERSION
  - PUBLISHER_PASSWORD
  - SERVER_MOTD
  - EULA
  - ONLINE_MODE
ui_theme:
  bg: "#1a140c"
  panel: "#2a2116"
  ink: "#f2e6c9"
  muted: "#a89068"
  accent: "#5aad32"
  good: "#7cbf4a"
  bad: "#d45c48"
  glow: "#3a2a14"
  wash: "#120e08"
  depth: "#0e0b07"
player_tracking_mode: count
restart_when_empty: true
copyparty:
  port: 8765
  root: "{data_dir}/{world_name}/uploaded_mods"
  password_option: publisher_password
  count_exclude:
    - AUTOMODPACK-FINGERPRINT.txt
  before_upload:
    - python3
    - /opt/publish_mod.py
    - --guard-upload
  after_idle_upload:
    - python3
    - /opt/publish_mod.py
  before_delete:
    - python3
    - /opt/publish_mod.py
    - --guard-delete
  after_delete:
    - python3
    - /opt/publish_mod.py
    - --after-delete
status_probe:
  interval_seconds: 10
  argv:
    - python3
    - /opt/haos_defaults.py
    - status-probe
log_patterns:
  ready:
    - '(?i)done \(.*\)! for help'
    - '(?i)starting minecraft server on'
  player_join:
    - '(?i)(?P<player>\S+) joined the game'
  player_leave:
    - '(?i)(?P<player>\S+) left the game'
  game_version:
    - '(?i)starting minecraft server version (?P<version>[\w.\-]+)'
log_pattern_candidates:
  ready:
    - '(?i)done \(.*\)! for help'
    - '(?i)starting minecraft server on'
  player_join:
    - '(?i)(?P<player>\S+) joined the game'
  player_leave:
    - '(?i)(?P<player>\S+) left the game'
  game_version:
    - '(?i)starting minecraft server version (?P<version>[\w.\-]+)'
