configuration:
  world_name:
    name: World name
    description: Default world profile folder (Open Web UI can switch/create more). The first world uses Minecraft 1.21.1 until you create another and pick a version.
  server_motd:
    name: MOTD
    description: Message of the day in server.properties.
  server_slots:
    name: Max players
    description: server.properties max-players.
  online_mode:
    name: Online mode
    description: Require Microsoft accounts (recommended).
  eula:
    name: Accept Minecraft EULA
    description: Required to run the official dedicated server.
  publisher_password:
    name: Upload page password
    description: Password for the mod-upload page (username is mods). Host port is on Network (container 8765).
  java_opts:
    name: Java options
    description: JVM flags (default -Xms2G -Xmx4G).
  update_on_start:
    name: Install on start
    description: Check the add-on install marker at start. Each world's Minecraft version is downloaded when that world boots, and is not changed by an add-on update.
  auto_update_interval_minutes:
    name: Auto-update interval (minutes)
    description: Keep 0. A world's Minecraft version changes only when that world is created, or when its profile.json version is edited on purpose.
  auto_update_check_hour:
    name: Daily update check hour
    description: Unused while the interval is 0.
  update_when_empty_only:
    name: Update only when empty
    description: If an install is needed, wait until nobody is online.
  update_on_version_mismatch:
    name: Update on version mismatch
    description: Leave off. Each world keeps the Minecraft version it was created with.
  debug_mode:
    name: Debug mode
    description: Show Ingress log-watch pattern tooling.
  update_window_start_hour:
    name: Update window start hour
    description: Optional local hour when installs may begin.
  update_window_end_hour:
    name: Update window end hour
    description: Optional local hour when installs must stop.
  restart_on_crash:
    name: Restart on crash
    description: Relaunch Minecraft after an unexpected exit.
  status_http_enabled:
    name: Status page
    description: Ingress Open Web UI on port 8099.
  ha_notifications:
    name: Home Assistant notifications
    description: Persistent notifications on crash and backup failure.
  backup_enabled:
    name: Enable backups
    description: Daily zip of the active world profile (save + mods).
  backup_on_update:
    name: Backup before update
    description: Snapshot the profile before an install.
  backup_retention:
    name: Backup retention
    description: minimal / standard / extended thinning.
  min_free_disk_mb:
    name: Minimum free disk (MiB)
    description: Skip backups when free space is below this.
network:
  25565/tcp: Minecraft Java (TCP). Players join host:25565.
  8765/tcp: Mod-upload page. Host port is on Network. Keep on the LAN.
