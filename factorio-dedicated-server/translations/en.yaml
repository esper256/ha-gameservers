configuration:
  world_name:
    name: Save name
    description: Factorio save file name without .zip (e.g. World). Created under /data/world/saves/ on first start or after NEW WORLD.
  server_name:
    name: Server name
    description: "Optional name shown in the Factorio server browser / LAN list. Leave blank to use a stable generated name like HAOS Factorio 4821 (same digits for this install; different across installs)."
  server_description:
    name: Server description
    description: Description shown in the Factorio server listing.
  server_password:
    name: Game password
    description: Password required to join (Factorio game_password). Leave empty for an open server.
  server_slots:
    name: Max players
    description: Maximum concurrent players (0 = unlimited in Factorio).
  auto_pause:
    name: Pause when empty
    description: Pause the simulation when no players are connected.
  autosave_interval:
    name: Autosave interval (minutes)
    description: Minutes between Factorio autosaves (default 10).
  visibility_lan:
    name: LAN visibility
    description: Broadcast the server on the local network (Play on LAN).
  visibility_public:
    name: Public server listing
    description: "Publish on Factorio’s public matching server. Requires Factorio.com username + token below (from factorio.com/profile). Not needed for LAN or direct IP. Default off."
  factorio_username:
    name: Factorio.com username
    description: "Your factorio.com username (not Steam). Only needed when Public server listing is on. Leave empty for LAN / direct connect. Not used to download the headless server."
  factorio_token:
    name: Factorio.com token
    description: "Auth token from factorio.com/profile (Reveal) — use this, not your account password. Only needed for public listing. Not used to download the headless server. Keep secret."
  space_age:
    name: Space Age DLC
    description: "The headless server binary always includes Space Age capability; this toggles the official DLC mods. Off (default) = base-game mode (plain Factorio clients can join). On = load elevated-rails / quality / space-age / recycler; every player needs Space Age. Set before first world create. Turning off later usually needs OPEN WEB UI → NEW WORLD."
  release_channel:
    name: Release channel
    description: "Which factorio.com headless build to install. Stable matches the current retail client; Experimental tracks Wube’s newer test builds (clients must match). Changing channel downloads that build on the next update."
  update_on_start:
    name: Update on start
    description: Check factorio.com for a newer free headless package before launching the server (no login; not SteamCMD).
  auto_update_interval_minutes:
    name: Auto-update interval (minutes)
    description: Used only when “Daily update check hour” is empty. How often to ask factorio.com whether a newer headless package exists. 0 turns periodic checks off. Values below 15 are raised to 15.
  auto_update_check_hour:
    name: Daily update check hour
    description: Local hour (0–23) to ask factorio.com once per day for a newer headless package. Default is 5 (5:00am). Leave empty to use the interval setting instead.
  update_when_empty_only:
    name: Update only when empty
    description: When a newer package is ready, wait until nobody is online before restarting so players are not interrupted. Uses Factorio [JOIN]/[LEAVE] log lines.
  update_on_version_mismatch:
    name: Update on version mismatch
    description: Unused for Factorio — mismatched clients do not emit a reliable log line the supervisor can detect. Leave off.
  debug_mode:
    name: Debug mode
    description: Show Ingress log-watch pattern tooling (dry-run regex hits) for optional further tuning. Leave off for normal operation.
  update_window_start_hour:
    name: Update window start hour
    description: Optional local hour (0-23) when routine headless-package updates may begin. Leave empty for any time.
  update_window_end_hour:
    name: Update window end hour
    description: Optional local hour (0-23) when routine headless-package updates must stop. Leave empty for any time.
  restart_on_crash:
    name: Restart on crash
    description: Automatically relaunch the server process after an unexpected exit.
  status_http_enabled:
    name: Status page
    description: Serve the supervisor status/log HTTP UI used by Home Assistant OPEN WEB UI (Ingress on port 8099).
  ha_notifications:
    name: Home Assistant notifications
    description: Create persistent notifications on crash, update failure, and version mismatch (uses HA Core API, not MQTT).
  backup_enabled:
    name: Enable backups
    description: Daily backup of the active world save (.zip copied as-is) into /data/backups. History is thinned by the retention profile below.
  backup_on_update:
    name: Backup before update
    description: Back up the world save immediately before a headless-package update. Only the newest pre-update backup is kept.
  backup_retention:
    name: Backup retention
    description: "Scheduled history uses daily→weekly→monthly thinning; pre-restore safety copies use the same profile (minimal=1 day, standard=7 days, extended=30 days). Only one pre-update backup is kept."
  min_free_disk_mb:
    name: Minimum free disk (MiB)
    description: Skip backups/updates when free space under /data falls below this threshold.
network:
  34197/udp: Game port players use in Factorio to reach this server on your Home Assistant machine (UDP). Leave at 34197 unless that port is already taken.
