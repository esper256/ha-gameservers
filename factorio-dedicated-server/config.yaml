name: "Factorio Dedicated Server"
description: "Factorio dedicated multiplayer server (free factorio.com headless package, no SteamCMD) with auto-updates, player-aware restarts, world backups, and an Ingress status UI."
version: "3.7.0"
slug: "factorio_dedicated_server"
url: "https://github.com/esper256/ha-gameservers/tree/main/factorio-dedicated-server"
# Factorio Linux headless binary is x86_64. HAOS on aarch64 will not offer this app.
arch:
  - amd64
startup: application
boot: auto
init: false
host_network: false
hassio_api: true
homeassistant_api: true
# Ingress = OPEN WEB UI (appears after the app is started). Uses HA auth; no host port.
ingress: true
ingress_port: 8099
ingress_entry: /
ingress_stream: true
panel_icon: mdi:cog
panel_title: Factorio
# HA format is "container-port/protocol: host-port". Container port is fixed
# at 34197 (Factorio default). The Network UI only changes the host port.
ports:
  34197/udp: 34197
ports_description:
  34197/udp: Game port players use on this Home Assistant machine (UDP). Leave at 34197 unless that port is already taken.
options:
  world_name: "FamilyFactory"
  server_name: ""
  server_description: "Welcome to the family Factorio server!"
  server_password: ""
  server_slots: 10
  auto_pause: true
  autosave_interval: 10
  visibility_lan: true
  visibility_public: false
  factorio_username: ""
  factorio_token: ""
  space_age: false
  release_channel: stable
  update_on_start: true
  auto_update_interval_minutes: 1440
  auto_update_check_hour: 5
  update_when_empty_only: true
  update_on_version_mismatch: false
  debug_mode: false
  restart_on_crash: true
  status_http_enabled: true
  ha_notifications: true
  backup_enabled: true
  backup_on_update: true
  backup_retention: standard
  min_free_disk_mb: 1024
schema:
  world_name: str
  server_name: str?
  server_description: str
  server_password: password
  server_slots: int(0,65535)
  auto_pause: bool
  autosave_interval: int(1,60)
  visibility_lan: bool
  visibility_public: bool
  factorio_username: str?
  factorio_token: password
  space_age: bool
  release_channel: list(stable|experimental)
  update_on_start: bool
  auto_update_interval_minutes: int(0,)
  auto_update_check_hour: int(0,23)?
  update_when_empty_only: bool
  update_on_version_mismatch: bool
  debug_mode: bool
  update_window_start_hour: int(0,23)?
  update_window_end_hour: int(0,23)?
  restart_on_crash: bool
  status_http_enabled: bool
  ha_notifications: bool
  backup_enabled: bool
  backup_on_update: bool
  backup_retention: list(minimal|standard|extended)
  min_free_disk_mb: int(0,)
backup_exclude:
  - "**/steamapps/**"
  - "**/steamcmd/**"
  - "game/**"
watchdog: http://[HOST]:[PORT:8099]/healthz
# Supervisor hard-caps timeout at 300. Values above that make the app vanish from the store.
# Used for Docker start *and* stop grace (SIGTERM → wait → SIGKILL). Keep game
# stop_timeout_seconds below this so post-quit supervisor cleanup can finish.
timeout: 300
