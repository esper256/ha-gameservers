name: Core Keeper
steam_app_id: 1963720
steam_login: anonymous
steam_branch: public
# Pin SteamCMD to Linux depots (this add-on is amd64 Linux / HAOS only).
steam_platform: linux
validate_on_update: true
working_dir: /data/game
data_dir: /data/world
logs_dir: /data/logs
# Unity data folder is present whether the binary is CoreKeeperServer or
# CoreKeeperServer.x86_64 (launch_wrapper.sh accepts either).
install_marker: CoreKeeperServer_Data
min_backup_bytes: 1024
# Unity save-on-SIGTERM; wrapper forwards the signal to the game process.
stop_timeout_seconds: 90
stop_stdin_commands: []
# Fallback roots when the named .world.gzip does not exist yet (first boot
# often waits until a player joins before writing worlds/). Also used to
# restore legacy *.tar.gz snapshots.
backup_paths:
  - /data/world
# Active world is a single gzip file under datapath/worlds/<index>.world.gzip
world_save:
  strategy: named_path
  world_name_option: world_index
  paths:
    - "{data_dir}/worlds/{world_index}.world.gzip"
world_catalog:
  glob: "{data_dir}/worlds/*.world.gzip"
  name_from: strip_suffix
  suffix: ".world.gzip"
# Wrapper sets up Xvfb, steamclient.so, and prints Game ID. Game argv follows.
executable:
  - /opt/launch_wrapper.sh
# Steamworks client app id (game), not the dedicated-server app id.
env:
  SteamAppId: "1621690"
  SteamGameId: "1621690"
  LD_LIBRARY_PATH: "/opt/steamcmd/linux64:/data/game/linux64:/data/game"
bool_style: true_false
ready_timeout_seconds: 300
# Official ARGUMENTS.txt: -port *adds* Direct Connect (IP join / cross-play).
# If omitted the server is Steam Datagram Relay only and will not accept IP.
# -gameid is independent. This app always passes -port so LAN IP, forwarded
# WAN IP, and Game ID work together (LAN IP + remote Steam on Game ID).
# on Game ID). run.sh sets SERVER_PORT=7778 to match the HA container port.
# Password is IP-only; Game ID join does not use it.
# Admin is not a CLI flag: haos_defaults merges admin_steam_ids into
# Admins.json under -datapath (env ADMIN_STEAM_IDS).
env_options:
  - ADMIN_STEAM_IDS
argv_prefix:
  - -batchmode
  - -logfile
  - "{logs_dir}/server.log"
  - -datapath
  - "{data_dir}"
arg_map:
  world_index: -world
  world_name: -worldname
  world_seed: -worldseed
  world_mode: -worldmode
  game_id: -gameid
  server_slots: -maxplayers
  server_port: -port
  server_password: -password
# Cavern teal / lantern amber Ingress theme (from official store art).
ui_theme:
  bg: "#0c1618"
  panel: "#152428"
  ink: "#e7f4f2"
  muted: "#7fa8a0"
  accent: "#3ec8e0"
  good: "#6fbf8a"
  bad: "#e07a6a"
  glow: "#1a3338"
  wash: "#081012"
  depth: "#1a140c"
# Presence: idle vs occupied. Join is in-world spawn (userid), not Steam-id
# auth or character-select connect. Leave uses that same userid. Steam id on
# Accepted connection / Successful authentication does not appear on leave.
# player_count / players_empty have no trustworthy lines.
player_tracking_mode: presence
# ready is the UDP bind (when Direct Connect can succeed). Started session is
# GameInfo / public-IP print and can fire after a client already connected.
# game_version from a live boot. version_mismatch from a client-too-old session
# (RpcSystem-specific so dump headers that repeat "bad protocol version" do
# not re-fire). App_Min / AppException_Max / Misc_Timeout are disconnect
# reasons, including normal leave — not mismatch signals.
log_patterns:
  ready:
    - 'Listening on ip:'
  game_version:
    - 'Game version:\s+(?P<version>\S+)'
  version_mismatch:
    - 'RpcSystem received bad protocol version'
  player_join:
    - '\[userid:(?P<player>\d+)\] player \S+ connected'
  player_leave:
    - 'Disconnected from userid:(?P<player>\d+)'
log_pattern_candidates:
  ready:
    - 'Listening on ip:'
    - 'successfully loaded world file'
    - 'Started session with info:'
    - '\bGame ID:'
    - '\bGameID:'
    - '----- GameInfo.txt -----'
    - '\bStarted session\b'
  player_join:
    - '\[userid:(?P<player>\d+)\] player \S+ connected'
    - 'Connected to userid:(?P<player>\d+)'
    - 'Successful authentication from userid:\s*(?P<player>\d+)'
    - 'Accepted connection from (?P<player>\d+) with result OK'
    - 'Accepted connect RPC'
    - 'Started game for new connection'
  player_leave:
    - 'Disconnected from userid:(?P<player>\S+)'
    - '\bplayer disconnect\b'
  game_version:
    - 'Game version:\s+(?P<version>\S+)'
    - '\bCore Keeper\s+(?P<version>\d+\.\d+\.\d+)'
    - '\bversion\s+(?P<version>\d+\.\d+\.\d+(?:\.\d+)?)'
  version_mismatch:
    - 'RpcSystem received bad protocol version'
    - '\bbad protocol version\b'
