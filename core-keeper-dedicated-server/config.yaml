name: "Core Keeper Dedicated Server"
description: "Core Keeper dedicated multiplayer server with SteamCMD auto-updates, player-aware restarts, generational world backups, and an Ingress status/log toolkit."
version: "3.14.0"
slug: "core_keeper_dedicated_server"
url: "https://github.com/esper256/ha-gameservers/tree/main/core-keeper-dedicated-server"
# SteamCMD / Core Keeper dedicated server binaries are x86_64. HAOS on aarch64 will not offer this app.
arch:
  - amd64
startup: application
boot: auto
init: false
host_network: false
hassio_api: true
homeassistant_api: true
# Ingress = OPEN WEB UI (appears after the app is started). Uses HA auth; no host port.
ingress: true
ingress_port: 8099
ingress_entry: /
ingress_stream: true
panel_icon: mdi:pickaxe
panel_title: Core Keeper
# HA format is "container-port/protocol: host-port". Container port is fixed
# at 7778 (Pugstorm Direct Connect example). The Network UI only changes the
# host port. Steam Game ID join still works alongside IP:port.
ports:
  7778/udp: 7778
ports_description:
  7778/udp: Game port for Direct Connect (UDP). Leave at 7778 unless that port is already taken. Steam players can still join with the Game ID (no forward needed for Game ID join).
# Direct Connect (-port) and Game ID (SDR) are both on. Mixed LAN IP +
# remote Game ID is supported. There is no public server-browser listing.
options:
  world_name: "World"
  world_index: 0
  world_seed: ""
  world_mode: 0
  game_id: ""
  server_password: ""
  admin_steam_ids: ""
  server_slots: 8
  steam_branch: public
  update_on_start: true
  auto_update_interval_minutes: 1440
  auto_update_check_hour: 5
  update_when_empty_only: true
  update_on_version_mismatch: true
  debug_mode: false
  restart_on_crash: true
  status_http_enabled: true
  ha_notifications: true
  backup_enabled: true
  backup_on_update: true
  backup_retention: standard
  min_free_disk_mb: 1024
schema:
  world_name: str
  world_index: int(0,29)
  world_seed: str?
  world_mode: list(0|1|2|4)
  game_id: str?
  server_password: password
  admin_steam_ids: str?
  server_slots: int(1,100)
  steam_branch: list(public|beta)
  update_on_start: bool
  auto_update_interval_minutes: int(0,)
  auto_update_check_hour: int(0,23)?
  update_when_empty_only: bool
  update_on_version_mismatch: bool
  debug_mode: bool
  update_window_start_hour: int(0,23)?
  update_window_end_hour: int(0,23)?
  restart_on_crash: bool
  status_http_enabled: bool
  ha_notifications: bool
  backup_enabled: bool
  backup_on_update: bool
  backup_retention: list(minimal|standard|extended)
  min_free_disk_mb: int(0,)
backup_exclude:
  - "**/steamapps/**"
  - "**/steamcmd/**"
  - "game/**"
watchdog: http://[HOST]:[PORT:8099]/healthz
# Supervisor hard-caps timeout at 300. Values above that make the app vanish from the store.
# Used for Docker start *and* stop grace (SIGTERM → wait → SIGKILL). Keep game
# stop_timeout_seconds below this so post-quit supervisor cleanup can finish.
timeout: 300
