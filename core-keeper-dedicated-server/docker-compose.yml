# Portainer / plain Docker example for Core Keeper.
# Builds the thin Core Keeper add-on image (generic supervisor + Unity/Xvfb + game.yaml).
#
# Security note: the status UI on :8099 is passwordless. Outside Home Assistant
# there is no Ingress auth and no peer allowlist. Bind it to localhost only
# (below), or put it behind your own reverse-proxy auth. Do not publish 8099 on
# a public interface.
#
# Join is both Direct Connect (UDP 7778, IP:port + password) and Steam Game ID
# (Datagram Relay) at once. Map 7778/udp on the host; forward it on your router
# only for remote IP join. Game ID joiners need no port-forward. Optional
# ADMIN_STEAM_IDS pins full admins in Admins.json (first joiner is otherwise
# auto-admin).
services:
  corekeeper:
    build:
      context: .
      dockerfile: Dockerfile
    image: core-keeper-dedicated-server:local
    container_name: corekeeper
    restart: unless-stopped
    ports:
      - "7778:7778/udp"
      - "127.0.0.1:8099:8099"
    environment:
      GAME_PLUGIN: /opt/games/game.yaml
      INSTALL_DIR: /data/game
      WORLD_NAME: World
      WORLD_INDEX: "0"
      WORLD_MODE: "0"
      SERVER_SLOTS: "8"
      SERVER_PORT: "7778"
      # Leave GAME_ID / SERVER_PASSWORD unset for stable generated values.
      # GAME_ID: yourExistingJoinCode
      # SERVER_PASSWORD: yourJoinPassword
      # Optional: pin SteamID64 admins (comma-separated). Blank =
      # first player to join a new world becomes admin.
      # ADMIN_STEAM_IDS: "76561198012345678,76561198087654321"
      UPDATE_ON_START: "true"
      AUTO_UPDATE_CHECK_HOUR: "5"
      AUTO_UPDATE_INTERVAL_MINUTES: "1440"
      UPDATE_WHEN_EMPTY_ONLY: "true"
      UPDATE_ON_VERSION_MISMATCH: "true"
      STATUS_HTTP_ENABLED: "true"
      STATUS_HTTP_PORT: "8099"
      HA_NOTIFICATIONS: "false"
      BACKUP_ENABLED: "true"
      BACKUP_INTERVAL_MINUTES: "1440"
      BACKUP_ON_UPDATE: "true"
      BACKUP_RETENTION: standard
      MIN_FREE_DISK_MB: "1024"
      TZ: America/Los_Angeles
    volumes:
      - ./data:/data
    # Match HA add-on timeout (300s): give Unity save-on-SIGTERM room before SIGKILL.
    stop_grace_period: 300s
    # Do not set network_mode: host here or host_network in config.yaml.
    # SteamCMD "FAILED (No Connection)" on this bridge is Docker NAT to Steam
    # CMs — see game-server-base/README.md "Local Compose".
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8099/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 180s
